name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version slot
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            slot="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            slot="${{ github.ref_name }}"
          else
            count=$(git rev-list --count HEAD)
            short=$(git rev-parse --short HEAD)
            slot="r${count}-${short}"
          fi
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build with explicit base URL
        env:
          VITE_BASE: /${{ github.event.repository.name }}/${{ steps.version.outputs.slot }}/
        run: pnpm run build

      - uses: brandon-fryslie/gh-pages-multiplexer@v1
        with:
          source-dir: dist
          version: ${{ steps.version.outputs.slot }}
          base-path-mode: none
